plugins {
    id 'org.sonarqube' version '7.4.0.8496'
}

sonar {
    properties {
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.organization', 'lydiagarcia03'
        property 'sonar.projectKey', 'lydiagarcia03_omni-sheet-vault'
        property 'sonar.projectName', 'omni-sheet-vault'
        property 'sonar.exclusions', '**/build/**,**/node_modules/**'
        // Flyway migrations are PostgreSQL; the PL/SQL (Oracle) rules don't apply to them
        // Developer command-line tools (5etools ingestion, dev-profile runners) have no tests by design
        property 'sonar.coverage.exclusions', '**/*Main.java,**/Character*Runner.java'
        property 'sonar.issue.ignore.multicriteria', 'plsqlMigrations,desktopCookie,csrfCookie'
        // The CSRF token cookie must be readable by the web app, which echoes it in X-XSRF-TOKEN (adr-0008)
        property 'sonar.issue.ignore.multicriteria.csrfCookie.ruleKey', 'java:S3330'
        property 'sonar.issue.ignore.multicriteria.csrfCookie.resourceKey', '**/shared/*SecurityConfig.java'
        property 'sonar.issue.ignore.multicriteria.plsqlMigrations.ruleKey', 'plsql:*'
        property 'sonar.issue.ignore.multicriteria.plsqlMigrations.resourceKey', '**/db/migration/**'
        // The desktop edition serves plain HTTP on 127.0.0.1, so its session cookie can't be Secure
        property 'sonar.issue.ignore.multicriteria.desktopCookie.ruleKey', 'java:S2092'
        property 'sonar.issue.ignore.multicriteria.desktopCookie.resourceKey', '**/application-desktop.yml'
    }
}