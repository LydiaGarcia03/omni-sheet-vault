# Settings for SonarQube Cloud's Automatic Analysis, which reads this file instead of build.gradle.
sonar.exclusions=**/build/**,**/node_modules/**
# Flyway migrations are PostgreSQL; the PL/SQL (Oracle) rules don't apply to them
# Developer command-line tools (5etools ingestion, dev-profile runners) have no tests by design
sonar.coverage.exclusions=**/*Main.java,**/Character*Runner.java
sonar.issue.ignore.multicriteria=plsqlMigrations,desktopCookie,csrfCookie
# The CSRF token cookie must be readable by the web app, which echoes it in X-XSRF-TOKEN (adr-0008)
sonar.issue.ignore.multicriteria.csrfCookie.ruleKey=java:S3330
sonar.issue.ignore.multicriteria.csrfCookie.resourceKey=**/shared/*SecurityConfig.java
sonar.issue.ignore.multicriteria.plsqlMigrations.ruleKey=plsql:*
sonar.issue.ignore.multicriteria.plsqlMigrations.resourceKey=**/db/migration/**
# The desktop edition serves plain HTTP on 127.0.0.1, so its session cookie can't be Secure
sonar.issue.ignore.multicriteria.desktopCookie.ruleKey=java:S2092
sonar.issue.ignore.multicriteria.desktopCookie.resourceKey=**/application-desktop.yml
